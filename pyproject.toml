[project]
name = "zxin-batch-image-tools"
version = "1.0.0"
description = "ComfyUI 自定义节点：批量图像加载、分发、切块、保存与角标标注"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Operating System :: OS Independent",
    "Environment :: GPU :: NVIDIA CUDA",
]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[project.urls]
Repository = "https://github.com/ZXinGod/ComfyUI_ZXin"
"Bug Tracker" = "https://github.com/ZXinGod/ComfyUI_ZXin/issues"

[tool.comfy]
PublisherId = "ZXinGod"
DisplayName = "ZXin Batch Image Tools"
requires-comfyui = ">=0.3.0"
